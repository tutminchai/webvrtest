<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>VR360 教學展示平台</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <script>
        // --- 註冊一個修正 iOS 黑畫面的組件 ---
        AFRAME.registerComponent('ios-video-fix', {
            init: function () {
                var videoEl = document.querySelector('#vr-video');
                var sceneEl = document.querySelector('a-scene');

                // 監聽進入 VR 模式的事件
                sceneEl.addEventListener('enter-vr', function () {
                    // 強制暫停再播放，觸發材質更新
                    if (videoEl.paused === false) {
                        videoEl.pause();
                        setTimeout(() => {
                            videoEl.play();
                        }, 500); // 延遲 0.5 秒重新播放
                    }
                });
            }
        });
    </script>

    <style>
        html, body { background-color: #000; margin: 0; overflow: hidden; font-family: sans-serif; }
        
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center;
        }
        .step-box { border: 1px solid #555; padding: 20px; border-radius: 10px; background: rgba(255,255,255,0.1); }
        .step-item { margin: 10px 0; font-size: 16px; }
        #start-btn { margin-top: 20px; padding: 10px 30px; font-size: 18px; background: #EF2D5E; color: white; border: none; border-radius: 5px; }

        #enter-vr-btn {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 9998; display: none;
            padding: 10px 20px; background: rgba(0,0,0,0.7); border: 2px solid #4CC3D9;
            color: #4CC3D9; border-radius: 20px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="step-box">
            <h3>VR 操作步驟</h3>
            <div class="step-item">1. 點擊「開始體驗」</div>
            <div class="step-item">2. 點擊下方「進入 VR 模式」</div>
            <div class="step-item">3. 若出現權限要求，請點「允許」</div>
            <div class="step-item">4. 手機橫放放入眼鏡</div>
        </div>
        <button id="start-btn" onclick="startExperience()">開始體驗</button>
    </div>

    <div id="enter-vr-btn" onclick="requestDevicePermission()">進入 VR 模式</div>

    <a-scene ios-video-fix 
             vr-mode-ui="enabled: false"
             renderer="antialias: true; colorManagement: true;">
        
        <a-assets>
            <video id="vr-video" 
                   src="video.mp4" 
                   loop="true" 
                   preload="auto" 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-videosphere src="#vr-video" rotation="0 -90 0"></a-videosphere>

        <a-camera position="0 0 0" look-controls="enabled: true"></a-camera>
    </a-scene>

    <script>
        var video = document.querySelector('#vr-video');
        var scene = document.querySelector('a-scene');

        function startExperience() {
            document.querySelector('#overlay').style.display = 'none';
            document.querySelector('#enter-vr-btn').style.display = 'block';
            video.play();
        }

        function requestDevicePermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            enterVRMode();
                        } else {
                            alert('請允許動作感測器權限');
                        }
                    })
                    .catch(console.error);
            } else {
                enterVRMode();
            }
        }

        function enterVRMode() {
            scene.enterVR();
            // 再次強制播放，以防切換瞬間被系統暫停
            setTimeout(() => {
               if(video.paused) video.play(); 
            }, 1000);
        }
    </script>
</body>
</html>
