<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>VR360 教學展示平台</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <style>
        /* 強制黑底 */
        html, body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        /* 覆蓋層 UI */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        .step-box { 
            border: 1px solid #666; padding: 20px; border-radius: 12px; 
            background: rgba(255,255,255,0.1); max-width: 80%; text-align: left;
        }
        .step-item { margin: 10px 0; font-size: 16px; color: #ddd; }
        .highlight { color: #4CC3D9; font-weight: bold; }
        
        #start-btn { 
            margin-top: 25px; padding: 12px 35px; font-size: 18px; 
            background: #EF2D5E; color: white; border: none; border-radius: 30px; 
        }

        /* VR 按鈕 */
        #enter-vr-btn {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 9998; display: none;
            padding: 12px 25px; background: rgba(0,0,0,0.8); border: 2px solid #fff;
            color: #fff; border-radius: 30px; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(4px);
            font-family: sans-serif;
        }
    </style>

    <script>
        // --- iOS 影片材質強制刷新組件 ---
        // 這段程式碼會強迫瀏覽器在進入 VR 時重新抓取影片畫面
        AFRAME.registerComponent('fix-ios-texture', {
            init: function () {
                var el = this.el;
                var video = document.querySelector('#vr-video');

                this.el.sceneEl.addEventListener('enter-vr', function () {
                    // 1. 強制重設材質
                    var material = el.getObject3D('mesh').material;
                    if (material.map) {
                        material.map.needsUpdate = true;
                    }
                    
                    // 2. 影片暫停再播放 (喚醒 iOS 渲染線程)
                    if(!video.paused){
                        video.pause();
                        setTimeout(function(){
                            video.play();
                            // 再次強制更新材質
                            if (material.map) material.map.needsUpdate = true;
                        }, 300); 
                    }
                });
            }
        });
    </script>
</head>
<body>

    <div id="overlay">
        <div class="step-box">
            <h3 style="margin-top:0; color: #4CC3D9;">VR 操作步驟</h3>
            <div class="step-item">1. 點擊 <span class="highlight">開始體驗</span></div>
            <div class="step-item">2. 等待影片開始播放</div>
            <div class="step-item">3. 點擊下方 <span class="highlight">進入 VR 模式</span></div>
            <div class="step-item">4. 若跳出視窗請點 <span class="highlight">允許 (Allow)</span></div>
        </div>
        <button id="start-btn" onclick="startExperience()">開始體驗</button>
    </div>

    <div id="enter-vr-btn" onclick="requestPermission()">進入 VR 模式</div>

    <a-scene vr-mode-ui="enabled: false" 
             renderer="antialias: true; colorManagement: true; sortObjects: true">
        
        <a-assets>
            <video id="vr-video" 
                   src="video.mp4" 
                   type="video/mp4"
                   preload="auto" 
                   loop="true"
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-sky src="#vr-video" 
               rotation="0 -90 0" 
               radius="500"
               fix-ios-texture>
        </a-sky>

        <a-camera position="0 0 0" look-controls="enabled: true"></a-camera>

    </a-scene>

    <script>
        var video = document.querySelector('#vr-video');
        var scene = document.querySelector('a-scene');

        function startExperience() {
            // 嘗試播放
            video.play().then(() => {
                document.querySelector('#overlay').style.display = 'none';
                document.querySelector('#enter-vr-btn').style.display = 'block';
            }).catch(error => {
                alert("無法自動播放，請檢查手機是否開啟靜音模式");
                console.error(error);
            });
        }

        function requestPermission() {
            // iOS 13+ 權限請求
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            enterVRAndPlay();
                        } else {
                            alert('需要感測器權限才能觀看 VR');
                        }
                    })
                    .catch(console.error);
            } else {
                // Android 或舊版 iOS
                enterVRAndPlay();
            }
        }

        function enterVRAndPlay() {
            scene.enterVR();
            
            // 確保影片持續播放
            if(video.paused) {
                video.play();
            }
        }
    </script>
</body>
</html>
