<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR360 最終修復版</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
        /* 強制黑底 */
        body { background-color: #000; margin: 0; overflow: hidden; font-family: sans-serif; }

        /* 隱藏影片元素和畫布 (它們在後台運作) */
        #vr-video, #video-canvas { display: none; }

        /* UI 介面 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center;
        }
        .box { border: 1px solid #555; padding: 20px; border-radius: 10px; background: rgba(255,255,255,0.1); }
        #start-btn { 
            margin-top: 20px; padding: 15px 40px; font-size: 18px; 
            background: #EF2D5E; color: white; border: none; border-radius: 30px; cursor: pointer;
        }
        #enter-vr-btn {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 9998; display: none;
            padding: 12px 25px; background: rgba(0,0,0,0.8); border: 2px solid #fff;
            color: #fff; border-radius: 30px; font-weight: bold; cursor: pointer;
        }
    </style>

    <script>
        // --- 核心邏輯：畫布更新組件 ---
        AFRAME.registerComponent('canvas-updater', {
            dependencies: ['geometry', 'material'],

            tick: function () {
                var el = this.el;
                var material = el.getObject3D('mesh').material;
                
                // 告訴 A-Frame 材質需要更新（因為畫布內容一直在變）
                if (material.map) {
                    material.map.needsUpdate = true;
                }
            }
        });
    </script>
</head>
<body>

    <video id="vr-video" 
           src="video.mp4" 
           preload="auto" 
           loop="true" 
           crossorigin="anonymous" 
           playsinline 
           webkit-playsinline
           muted>
    </video>

    <canvas id="video-canvas"></canvas>

    <div id="overlay">
        <div class="box">
            <h3>VR 體驗指南</h3>
            <p>1. 點擊「開始」</p>
            <p>2. 點擊下方「進入 VR」</p>
            <p>3. 允許權限並放入眼鏡</p>
        </div>
        <button id="start-btn" onclick="initVideoCanvas()">開始載入</button>
    </div>

    <div id="enter-vr-btn" onclick="requestPermission()">進入 VR 模式</div>

    <a-scene vr-mode-ui="enabled: false">
        
        <a-sphere id="vr-sphere"
                  radius="500"
                  src="#video-canvas"
                  scale="-1 1 1" 
                  shader="flat"
                  canvas-updater>
        </a-sphere>

        <a-camera position="0 0 0" look-controls="enabled: true"></a-camera>

    </a-scene>

    <script>
        var video = document.getElementById('vr-video');
        var canvas = document.getElementById('video-canvas');
        var ctx = canvas.getContext('2d');
        var scene = document.querySelector('a-scene');

        // 啟動變數
        var isVideoPlaying = false;

        function initVideoCanvas() {
            // 1. 先播放影片
            video.play().then(() => {
                console.log("Video playing");
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('enter-vr-btn').style.display = 'block';
                
                // 2. 設定畫布大小等於影片大小
                // 如果讀不到尺寸，先給個預設值，等 metadata 載入
                if (video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                } else {
                    canvas.width = 1920;
                    canvas.height = 960;
                }
                
                isVideoPlaying = true;
                drawLoop(); // 開始繪製迴圈

            }).catch(e => {
                console.error(e);
                alert("請點擊畫面觸發播放");
            });
        }

        // 核心迴圈：不斷把影片畫到 Canvas 上
        function drawLoop() {
            if (isVideoPlaying) {
                // 如果影片尺寸變了(載入完成)，更新畫布尺寸
                if (canvas.width !== video.videoWidth && video.videoWidth > 0) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
                
                // 繪製影格
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // 下一幀
                requestAnimationFrame(drawLoop);
            }
        }

        function requestPermission() {
            // iOS 13+ 權限
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            scene.enterVR();
                        } else {
                            alert('需要權限');
                        }
                    })
                    .catch(console.error);
            } else {
                scene.enterVR();
            }
        }
        
        // 監聽 VR 模式，防止手機休眠導致影片暫停
        scene.addEventListener('enter-vr', function () {
            if(video.paused) video.play();
        });
    </script>
</body>
</html>
