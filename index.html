<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR360 防彈修復版</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center;
        }
        .box {
            border: 1px solid #555; padding: 25px; border-radius: 15px; 
            background: rgba(30,30,30,0.9); max-width: 85%;
        }
        #start-btn {
            padding: 15px 50px; font-size: 22px; background: #EF2D5E; 
            color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 25px;
            font-weight: bold; transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.95); }
        
        #status-text { margin-top: 15px; color: #aaa; font-size: 14px; }

        /* 退出按鈕 */
        #exit-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            background: rgba(0,0,0,0.6); color: white; border: 1px solid white;
            padding: 8px 15px; border-radius: 20px; display: none; cursor: pointer;
            backdrop-filter: blur(5px);
        }
    </style>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            alert("程式錯誤:\n" + msg + "\n行數: " + line);
            document.getElementById('status-text').innerText = "錯誤: " + msg;
            return false;
        };
    </script>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="overlay">
        <div class="box">
            <h2>VR360 體驗</h2>
            <p>使用 Canvas 代理 + 手動立體渲染</p>
            <p style="color: yellow; font-size: 12px;">若點擊無反應請檢查網路</p>
            <button id="start-btn">載入影片</button>
            <div id="status-text">準備就緒</div>
        </div>
    </div>

    <button id="exit-btn">退出 VR</button>

    <video id="video" loop muted crossOrigin="anonymous" playsinline webkit-playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>

    <canvas id="video-canvas" style="display:none"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { StereoEffect } from 'three/addons/effects/StereoEffect.js';
        import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';

        // 宣告全域變數
        let camera, scene, renderer, effect, controls;
        let video, videoCanvas, videoContext, texture;
        let isVRMode = false;
        let animationId;

        // UI 元素
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const statusText = document.getElementById('status-text');
        const exitBtn = document.getElementById('exit-btn');
        
        // 建立「進入 VR」按鈕
        const enterVrBtn = document.createElement('button');
        enterVrBtn.innerText = "進入 VR 模式 (Enter VR)";
        enterVrBtn.style.cssText = "position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: rgba(0,0,0,0.8); color: white; border: 2px solid #4CC3D9; border-radius: 30px; font-weight: bold; z-index: 998; display: none; font-size: 16px;";
        document.body.appendChild(enterVrBtn);

        try {
            init();
            animate();
            statusText.innerText = "核心載入成功，請點擊按鈕";
        } catch (e) {
            alert("初始化失敗: " + e.message);
        }

        function init() {
            // 場景設定
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);

            // --- 核心：Canvas 畫布代理 (解決 iPhone 黑畫面) ---
            video = document.getElementById('video');
            videoCanvas = document.getElementById('video-canvas');
            videoContext = videoCanvas.getContext('2d');

            // 預設給一個灰色背景，證明 Canvas 有在運作
            videoCanvas.width = 1920;
            videoCanvas.height = 960;
            videoContext.fillStyle = '#333';
            videoContext.fillRect(0, 0, videoCanvas.width, videoCanvas.height);
            
            // 寫字在畫布上測試
            videoContext.font = "100px Arial";
            videoContext.fillStyle = "white";
            videoContext.fillText("載入中...", 800, 480);

            texture = new THREE.CanvasTexture(videoCanvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            
            // 建立球體
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1); // 內外翻轉
            const material = new THREE.MeshBasicMaterial({ map: texture });
            scene.add(new THREE.Mesh(geometry, material));

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 立體分屏特效 (StereoEffect)
            effect = new StereoEffect(renderer);
            effect.eyeSeparation = 1; 
            effect.setSize(window.innerWidth, window.innerHeight);

            // 事件監聽
            window.addEventListener('resize', onWindowResize);

            // --- 按鈕 1: 載入影片 ---
            startBtn.addEventListener('click', function() {
                statusText.innerText = "嘗試播放影片...";
                
                // 先解鎖聲音
                video.muted = false;
                
                video.play().then(() => {
                    console.log("播放成功");
                    statusText.innerText = "播放成功！";
                    overlay.style.display = 'none';
                    enterVrBtn.style.display = 'block';
                    
                    // 更新畫布尺寸
                    if (video.videoWidth) {
                        videoCanvas.width = video.videoWidth;
                        videoCanvas.height = video.videoHeight;
                    }
                }).catch(err => {
                    console.error(err);
                    // 備案：靜音播放
                    statusText.innerText = "自動播放受阻，嘗試靜音播放...";
                    video.muted = true;
                    video.play().then(() => {
                        overlay.style.display = 'none';
                        enterVrBtn.style.display = 'block';
                    }).catch(e => alert("影片播放失敗，請檢查檔案: " + e.message));
                });
            });

            // --- 按鈕 2: 進入 VR ---
            enterVrBtn.addEventListener('click', function() {
                requestOrientationPermission();
            });

            // --- 按鈕 3: 退出 VR ---
            exitBtn.addEventListener('click', function() {
                isVRMode = false;
                exitBtn.style.display = 'none';
                enterVrBtn.style.display = 'block';
                camera.position.set(0,0,0);
                camera.rotation.set(0,0,0);
                controls = null; // 移除陀螺儀控制
                onWindowResize();
            });
        }

        // iOS 陀螺儀權限請求
        function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            enableVRMode();
                        } else {
                            alert('您拒絕了動作權限，無法轉頭觀看。');
                            // 即使拒絕也讓他進去看看，只是不能轉頭
                            enableVRMode(); 
                        }
                    })
                    .catch(e => alert("權限請求錯誤: " + e));
            } else {
                // Android 直接進入
                enableVRMode();
            }
        }

        function enableVRMode() {
            isVRMode = true;
            enterVrBtn.style.display = 'none';
            exitBtn.style.display = 'block';
            
            // 啟動陀螺儀
            if (!controls) {
                controls = new DeviceOrientationControls(camera);
            }
            
            // 嘗試全螢幕
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {});
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if(effect) effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 每一幀將影片畫到 Canvas
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                texture.needsUpdate = true;
            }

            if (isVRMode) {
                // VR 模式：陀螺儀 + 立體渲染
                if (controls) controls.update();
                effect.render(scene, camera);
            } else {
                // 一般模式：平面渲染
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
