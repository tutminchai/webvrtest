<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR360 終極手動版</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center;
        }
        .box {
            border: 1px solid #555; padding: 25px; border-radius: 15px; 
            background: rgba(255,255,255,0.15); max-width: 85%;
        }
        #start-btn {
            padding: 15px 40px; font-size: 20px; background: #EF2D5E; 
            color: white; border: none; border-radius: 30px; cursor: pointer; margin-top: 20px;
            font-weight: bold;
        }
        /* 退出按鈕 (在 VR 模式下顯示) */
        #exit-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            background: rgba(0,0,0,0.5); color: white; border: 1px solid white;
            padding: 10px; border-radius: 5px; display: none; cursor: pointer;
        }
        p { color: #ccc; margin: 10px 0; font-size: 15px; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="box">
            <h2>VR360 體驗</h2>
            <p>1. 點擊「開始」</p>
            <p>2. 點擊 "進入 VR 模式"</p>
            <p>3. 允許動作權限 (若跳出)</p>
            <button id="start-btn">開始</button>
        </div>
    </div>

    <button id="exit-btn">退出 VR</button>

    <video id="video" loop muted crossOrigin="anonymous" playsinline webkit-playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>

    <canvas id="video-canvas" style="display:none"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        // 引入立體分屏特效
        import { StereoEffect } from 'three/addons/effects/StereoEffect.js';
        // 引入陀螺儀控制
        import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';

        let camera, scene, renderer, effect, controls;
        let video, videoCanvas, videoContext, texture;
        let isVRMode = false;
        
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const exitBtn = document.getElementById('exit-btn');

        // 建立一個假的 VR 按鈕
        const vrBtn = document.createElement('button');
        vrBtn.innerText = "進入 VR 模式";
        vrBtn.style.cssText = "position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: rgba(0,0,0,0.8); color: white; border: 2px solid white; border-radius: 30px; font-weight: bold; z-index: 998; display: none;";
        document.body.appendChild(vrBtn);

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111); // 深灰底

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);
            
            // --- Canvas 代理 (保留這個，因為它很穩定) ---
            video = document.getElementById('video');
            videoCanvas = document.getElementById('video-canvas');
            videoContext = videoCanvas.getContext('2d');

            videoCanvas.width = 1920;
            videoCanvas.height = 960;
            videoContext.fillStyle = '#000000';
            videoContext.fillRect(0,0, videoCanvas.width, videoCanvas.height);

            texture = new THREE.CanvasTexture(videoCanvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            
            // 球體
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);
            const material = new THREE.MeshBasicMaterial({ map: texture });
            scene.add(new THREE.Mesh(geometry, material));

            // --- 渲染器設定 ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // --- 立體特效 (這是重點！) ---
            effect = new StereoEffect(renderer);
            effect.eyeSeparation = 1; // 調整兩眼距離，可微調
            effect.setSize(window.innerWidth, window.innerHeight);

            // --- 事件監聽 ---
            window.addEventListener('resize', onWindowResize);

            // 1. 點擊開始
            startBtn.addEventListener('click', function() {
                video.muted = false;
                video.play().then(()=> {
                    overlay.style.display = 'none';
                    vrBtn.style.display = 'block'; // 顯示進入 VR 按鈕
                }).catch(err => {
                    video.muted = true;
                    video.play();
                    overlay.style.display = 'none';
                    vrBtn.style.display = 'block';
                });
            });

            // 2. 點擊進入 VR
            vrBtn.addEventListener('click', function() {
                requestOrientationPermission();
            });

            // 3. 退出 VR
            exitBtn.addEventListener('click', function() {
                isVRMode = false;
                exitBtn.style.display = 'none';
                vrBtn.style.display = 'block';
                // 恢復正常視角 (稍微重置一下相機)
                camera.fov = 70;
                camera.updateProjectionMatrix();
                onWindowResize();
            });
        }

        // --- 請求 iOS 陀螺儀權限 ---
        function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            enableVRMode();
                        } else {
                            alert('需要動作權限才能轉頭觀看');
                        }
                    })
                    .catch(console.error);
            } else {
                enableVRMode();
            }
        }

        function enableVRMode() {
            isVRMode = true;
            vrBtn.style.display = 'none';
            exitBtn.style.display = 'block';
            
            // 啟動陀螺儀控制
            if (!controls) {
                controls = new DeviceOrientationControls(camera);
            }
            
            // 強制全螢幕 (如果瀏覽器支援)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {});
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if(effect) effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Canvas 代理更新
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                texture.needsUpdate = true;
            }

            if (isVRMode) {
                // VR 模式：使用陀螺儀 + 立體分屏渲染
                if (controls) controls.update();
                effect.render(scene, camera);
            } else {
                // 一般模式：普通渲染
                // 這裡可以加一個簡單的滑鼠/手指拖曳控制 (OrbitControls)，
                // 但為了簡化程式碼，這裡一般模式暫時固定視角或您可自行加入
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
