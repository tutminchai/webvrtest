<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR360 虛擬實境導覽</title>
    <style>
        /* --- 全局設定 --- */
        body { margin: 0; background-color: #000; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
        
        /* --- 1. 啟動畫面 (美化版) --- */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* 背景加入微弱漸層，看起來更有質感 */
            background: radial-gradient(circle at center, #2b2b2b 0%, #000000 100%);
            display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center;
            transition: opacity 0.5s; /* 淡出動畫 */
        }

        .box {
            /* 毛玻璃效果 */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; 
            border-radius: 20px; 
            max-width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { margin: 0 0 10px 0; font-size: 28px; font-weight: 300; letter-spacing: 2px; }
        h2 { margin: 0 0 20px 0; font-size: 16px; color: #4CC3D9; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #ccc; margin: 5px 0; font-size: 14px; line-height: 1.6; }
        
        /* --- 按鈕設計 --- */
        #start-btn {
            margin-top: 30px;
            padding: 15px 60px; 
            font-size: 18px; 
            /* 漸層按鈕 */
            background: linear-gradient(135deg, #EF2D5E 0%, #C51B43 100%);
            color: white; border: none; border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(239, 45, 94, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: none; /* 預設隱藏，等程式庫載入好才出現 */
        }
        #start-btn:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(239, 45, 94, 0.2); }

        /* 載入中的轉圈圈 (選用) */
        #loader {
            margin-top: 30px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #4CC3D9;
            border-radius: 50%;
            width: 30px; height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- VR 控制按鈕 --- */
        .vr-btn {
            position: fixed; z-index: 1000; cursor: pointer;
            background: rgba(20, 20, 20, 0.8); 
            color: white; border: 1px solid rgba(255,255,255,0.5);
            font-weight: bold; backdrop-filter: blur(5px);
            transition: background 0.3s;
        }
        .vr-btn:hover { background: rgba(50, 50, 50, 0.9); }

        #enter-vr-btn {
            bottom: 50px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; border-radius: 30px; display: none; font-size: 16px;
            border: 1px solid #4CC3D9; color: #4CC3D9;
        }
        #exit-btn {
            top: 20px; right: 20px; padding: 8px 20px; border-radius: 20px; display: none; font-size: 14px;
        }
        
        .footer { margin-top: 20px; font-size: 12px; color: #666; }

    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>

</head>
<body>

    <div id="overlay">
        <div class="box">
            <h1>VR360 導覽</h1>
            <h2>Virtual Reality Tour</h2>
            
            <p>1. 點擊下方按鈕載入影片</p>
            <p>2. 建議佩戴耳機以獲得最佳體驗</p>
            <p>3. 點擊「進入 VR」後放入眼鏡</p>

            <div id="loader"></div>
            
            <button id="start-btn">開始體驗</button>
            
            <div class="footer">Built with WebVR Technology</div>
        </div>
    </div>

    <button id="enter-vr-btn" class="vr-btn">👓 進入 VR 模式</button>
    <button id="exit-btn" class="vr-btn">退出模式</button>

    <video id="video" loop muted crossOrigin="anonymous" playsinline webkit-playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>

    <canvas id="video-canvas" style="display:none"></canvas>

    <script>
        // --- 1. 系統檢查與初始化 ---
        window.onload = function() {
            var loader = document.getElementById('loader');
            var startBtn = document.getElementById('start-btn');
            
            if (typeof THREE === 'undefined') {
                alert("網路載入失敗，請檢查網路連線");
            } else {
                // 隱藏轉圈圈，顯示開始按鈕
                loader.style.display = 'none';
                startBtn.style.display = 'block';
                initVR(); // 預先初始化場景
            }
        };

        // --- 全域變數 ---
        var camera, scene, renderer, effect, controls;
        var video, videoCanvas, videoContext, texture;
        var isVR = false;
        var animationId;

        function initVR() {
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000000); // 純黑背景
                camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);

                // --- 畫布代理 (iPhone 黑屏救星) ---
                video = document.getElementById('video');
                videoCanvas = document.getElementById('video-canvas');
                videoContext = videoCanvas.getContext('2d');
                
                // 設定畫布初始尺寸
                videoCanvas.width = 1920; 
                videoCanvas.height = 960;
                videoContext.fillStyle = '#000000';
                videoContext.fillRect(0,0,1920,960);
                
                texture = new THREE.CanvasTexture(videoCanvas);
                texture.minFilter = THREE.LinearFilter;
                
                // 建立球體
                var geometry = new THREE.SphereGeometry(500, 60, 40);
                geometry.scale(-1, 1, 1);
                var material = new THREE.MeshBasicMaterial({ map: texture });
                scene.add(new THREE.Mesh(geometry, material));

                // 渲染器
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                // 立體特效
                effect = new THREE.StereoEffect(renderer);
                effect.eyeSeparation = 1;
                effect.setSize(window.innerWidth, window.innerHeight);

                // 事件綁定
                window.addEventListener('resize', onResize, false);
                setupInteractions();
                animate();

            } catch (e) {
                console.error("初始化錯誤:", e);
            }
        }

        function setupInteractions() {
            var startBtn = document.getElementById('start-btn');
            var overlay = document.getElementById('overlay');
            var enterBtn = document.getElementById('enter-vr-btn');
            var exitBtn = document.getElementById('exit-btn');

            // 1. 開始體驗
            startBtn.addEventListener('click', function() {
                startBtn.innerText = "載入中..."; // 點擊後的回饋
                video.muted = false; // 嘗試解鎖聲音
                
                video.play().then(function() {
                    overlay.style.opacity = 0; // 淡出動畫
                    setTimeout(function(){ overlay.style.display = 'none'; }, 500);
                    
                    enterBtn.style.display = 'block';
                    
                    // 根據影片真實尺寸調整畫布
                    if (video.videoWidth) {
                        videoCanvas.width = video.videoWidth;
                        videoCanvas.height = video.videoHeight;
                    }
                }).catch(function(err) {
                    // 自動播放失敗的備案 (靜音播放)
                    video.muted = true;
                    video.play();
                    overlay.style.display = 'none';
                    enterBtn.style.display = 'block';
                    alert("請注意：影片將以靜音模式播放，請檢查手機靜音開關。");
                });
            });

            // 2. 進入 VR 模式
            enterBtn.addEventListener('click', function() {
                // 請求 iOS 動作權限
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(function(response) {
                            if (response == 'granted') {
                                enableVR();
                            } else {
                                alert("未授權陀螺儀，將無法轉頭觀看，但仍可顯示畫面。");
                                enableVR();
                            }
                        })
                        .catch(function(e) { console.error(e); });
                } else {
                    enableVR();
                }
            });

            // 3. 退出
            exitBtn.addEventListener('click', function() {
                isVR = false;
                enterBtn.style.display = 'block';
                exitBtn.style.display = 'none';
                controls = null;
                camera.rotation.set(0,0,0);
                onResize();
            });
        }

        function enableVR() {
            isVR = true;
            document.getElementById('enter-vr-btn').style.display = 'none';
            document.getElementById('exit-btn').style.display = 'block';
            
            if (!controls) {
                controls = new THREE.DeviceOrientationControls(camera);
            }

            // 嘗試全螢幕
            var docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (effect) effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 核心：畫布持續更新
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                texture.needsUpdate = true;
            }

            if (isVR) {
                if (controls) controls.update();
                effect.render(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
