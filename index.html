<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR360 畫布修復版</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center;
        }
        .box {
            border: 1px solid #555; padding: 20px; border-radius: 15px; 
            background: rgba(255,255,255,0.1); max-width: 85%;
        }
        #start-btn {
            padding: 15px 40px; font-size: 18px; background: #EF2D5E; 
            color: white; border: none; border-radius: 30px; cursor: pointer; margin-top: 20px;
            font-weight: bold;
        }
        p { color: #ccc; margin: 10px 0; font-size: 14px; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.min.js"></script>
    
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
        // 啟動除錯模式
        var vConsole = new VConsole();
        console.log("vConsole 啟動: 準備捕捉錯誤");
    </script>
</head>
<body>

    <div id="overlay">
        <div class="box">
            <h2>VR360 最終修復</h2>
            <p>使用 Canvas 代理渲染技術</p>
            <p>1. 點擊「開始載入」</p>
            <p>2. 等待畫面出現</p>
            <p>3. 點擊底部 "ENTER VR"</p>
            <button id="start-btn">開始載入</button>
        </div>
    </div>

    <video id="video" 
           loop muted crossOrigin="anonymous" 
           playsinline webkit-playsinline 
           style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>

    <canvas id="video-canvas" style="display:none"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // 啟動 Polyfill
        const polyfill = new WebXRPolyfill();
        console.log("Polyfill active");

        let camera, scene, renderer;
        let video, videoCanvas, videoContext, texture;
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 背景黑

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);
            
            // --- 核心修改：Canvas 代理 ---
            video = document.getElementById('video');
            videoCanvas = document.getElementById('video-canvas');
            videoContext = videoCanvas.getContext('2d');

            // 預設畫布大小 (避免初始全黑)
            videoCanvas.width = 1920;
            videoCanvas.height = 960;
            videoContext.fillStyle = '#333333';
            videoContext.fillRect(0, 0, videoCanvas.width, videoCanvas.height);

            // 使用 CanvasTexture 而不是 VideoTexture
            texture = new THREE.CanvasTexture(videoCanvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            
            // 球體
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1); // 內外翻轉

            // 使用 Basic 材質
            const material = new THREE.MeshBasicMaterial({ map: texture });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local');
            
            container.appendChild(renderer.domElement);

            // 加入 VR 按鈕
            const vrButton = VRButton.createButton(renderer);
            document.body.appendChild(vrButton);

            window.addEventListener('resize', onWindowResize);

            // --- 點擊事件 ---
            startBtn.addEventListener('click', function() {
                console.log("User clicked start");
                
                // 1. 播放影片
                video.play().then(()=> {
                    console.log("Video playing successfully");
                    overlay.style.display = 'none';
                    
                    // 更新畫布尺寸以符合影片真實尺寸
                    if (video.videoWidth) {
                        videoCanvas.width = video.videoWidth;
                        videoCanvas.height = video.videoHeight;
                    }
                }).catch(err => {
                    console.error("Video play error:", err);
                    alert("播放錯誤: " + err.message);
                });
            });
            
            // 監聽 VR 按鈕點擊，防止進入 VR 後暫停
            vrButton.addEventListener('click', function() {
                console.log("Entering VR...");
                setTimeout(() => {
                    if(video.paused) {
                        console.log("Resuming video in VR");
                        video.play();
                    }
                }, 1000);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // --- 關鍵：手動將影片畫到 Canvas 上 ---
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 將影片的當前影格畫到 Canvas
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                // 告訴 Three.js 紋理已經更新，需要重繪
                texture.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
