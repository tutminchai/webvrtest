<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR360 復古穩定版</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center;
        }
        .box {
            border: 1px solid #666; padding: 30px; border-radius: 15px; 
            background: rgba(20,20,20,0.95); max-width: 80%;
        }
        #start-btn {
            padding: 15px 50px; font-size: 22px; background: #EF2D5E; 
            color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 25px;
            font-weight: bold;
        }
        #status { margin-top: 15px; color: #aaa; font-size: 14px; }
        
        /* 退出與進入按鈕 */
        .vr-btn {
            position: fixed; z-index: 1000; cursor: pointer;
            background: rgba(0,0,0,0.7); color: white; border: 2px solid white;
            font-weight: bold;
        }
        #enter-vr-btn {
            bottom: 50px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; border-radius: 30px; display: none; font-size: 16px;
        }
        #exit-btn {
            top: 20px; right: 20px; padding: 8px 15px; border-radius: 20px; display: none;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>

    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
        // 啟動 vConsole
        var vConsole = new VConsole();
        console.log("系統啟動: 傳統模式 (No Modules)");
    </script>
</head>
<body>

    <div id="overlay">
        <div class="box">
            <h2>VR360 體驗</h2>
            <p>復古架構 + Canvas 核心</p>
            <div id="loading-check" style="color: yellow; font-size:12px;">正在檢查程式庫...</div>
            <button id="start-btn" style="display:none">載入影片</button>
            <div id="status">初始化中...</div>
        </div>
    </div>

    <button id="enter-vr-btn" class="vr-btn">進入 VR 模式</button>
    <button id="exit-btn" class="vr-btn">退出</button>

    <video id="video" loop muted crossOrigin="anonymous" playsinline webkit-playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>

    <canvas id="video-canvas" style="display:none"></canvas>

    <script>
        // --- 檢查程式庫是否載入成功 ---
        // 這是解決「無反應」的關鍵檢查
        window.onload = function() {
            var checkDiv = document.getElementById('loading-check');
            var startBtn = document.getElementById('start-btn');
            
            if (typeof THREE === 'undefined') {
                checkDiv.innerHTML = "❌ 錯誤: 無法連線至 Three.js CDN<br>請檢查網路連線";
                checkDiv.style.color = "red";
                alert("嚴重錯誤: 程式庫下載失敗，請切換網路 (如 4G/Wi-Fi) 再試");
            } else {
                checkDiv.innerHTML = "✅ 核心程式庫已載入";
                checkDiv.style.color = "#4caf50";
                startBtn.style.display = "block"; // 顯示按鈕
                document.getElementById('status').innerText = "準備就緒";
                initVR(); // 啟動主程式
            }
        };

        // --- 全域變數 ---
        var camera, scene, renderer, effect, controls;
        var video, videoCanvas, videoContext, texture;
        var isVR = false;

        function initVR() {
            try {
                // 場景
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x111111);
                camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);

                // --- 畫布代理設定 (iPhone 防黑屏關鍵) ---
                video = document.getElementById('video');
                videoCanvas = document.getElementById('video-canvas');
                videoContext = videoCanvas.getContext('2d');
                
                // 預設畫布
                videoCanvas.width = 1920; 
                videoCanvas.height = 960;
                videoContext.fillStyle = '#222';
                videoContext.fillRect(0,0,1920,960);
                
                texture = new THREE.CanvasTexture(videoCanvas);
                texture.minFilter = THREE.LinearFilter;
                
                // 建立球體
                var geometry = new THREE.SphereGeometry(500, 60, 40);
                geometry.scale(-1, 1, 1);
                var material = new THREE.MeshBasicMaterial({ map: texture });
                scene.add(new THREE.Mesh(geometry, material));

                // 渲染器
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                // 立體特效 (使用舊版語法)
                effect = new THREE.StereoEffect(renderer);
                effect.eyeSeparation = 1;
                effect.setSize(window.innerWidth, window.innerHeight);

                // 綁定事件
                window.addEventListener('resize', onResize, false);
                setupButtons();
                animate();

                console.log("主程式初始化完成");

            } catch (e) {
                alert("初始化錯誤: " + e.message);
                console.error(e);
            }
        }

        function setupButtons() {
            var startBtn = document.getElementById('start-btn');
            var overlay = document.getElementById('overlay');
            var enterBtn = document.getElementById('enter-vr-btn');
            var exitBtn = document.getElementById('exit-btn');
            var status = document.getElementById('status');

            // 1. 載入按鈕
            startBtn.addEventListener('click', function() {
                status.innerText = "正在緩衝影片...";
                video.muted = false; // 嘗試開啟聲音
                
                video.play().then(function() {
                    status.innerText = "播放中";
                    overlay.style.display = 'none';
                    enterBtn.style.display = 'block';
                    
                    if (video.videoWidth) {
                        videoCanvas.width = video.videoWidth;
                        videoCanvas.height = video.videoHeight;
                    }
                }).catch(function(err) {
                    console.error(err);
                    // 失敗就靜音播放
                    video.muted = true;
                    video.play();
                    overlay.style.display = 'none';
                    enterBtn.style.display = 'block';
                    alert("注意：已啟用靜音播放模式 (請檢查手機靜音開關)");
                });
            });

            // 2. 進入 VR
            enterBtn.addEventListener('click', function() {
                // 請求權限 (iOS 13+)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(function(response) {
                            if (response == 'granted') {
                                enableVR();
                            } else {
                                alert("拒絕權限將無法轉頭，但仍可觀看");
                                enableVR();
                            }
                        })
                        .catch(function(e) { alert(e); });
                } else {
                    enableVR();
                }
            });

            // 3. 退出
            exitBtn.addEventListener('click', function() {
                isVR = false;
                enterBtn.style.display = 'block';
                exitBtn.style.display = 'none';
                controls = null;
                camera.rotation.set(0,0,0);
                onResize();
            });
        }

        function enableVR() {
            isVR = true;
            document.getElementById('enter-vr-btn').style.display = 'none';
            document.getElementById('exit-btn').style.display = 'block';
            
            // 啟動陀螺儀
            if (!controls) {
                controls = new THREE.DeviceOrientationControls(camera);
            }

            // 全螢幕
            var docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (effect) effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Canvas 更新迴圈
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                texture.needsUpdate = true;
            }

            if (isVR) {
                if (controls) controls.update();
                effect.render(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
