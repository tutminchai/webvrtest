<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片檔案診斷工具</title>
    <style>
        body { background: #222; color: white; text-align: center; padding: 20px; font-family: sans-serif; }
        video { width: 100%; max-width: 600px; border: 2px solid white; margin-top: 20px; }
        .status { margin-top: 10px; color: yellow; }
    </style>
</head>
<body>

    <h2>🛠 VR 影片診斷模式</h2>
    <p>如果下方影片無法播放，代表檔案本身有問題。</p>

    <video controls playsinline autoplay muted>
        <source src="video.mp4" type="video/mp4">
        您的瀏覽器不支援影片播放，或是路徑錯誤。
    </video>

    <div class="status">
        診斷清單：<br>
        1. 檔名是否為 video.mp4 (全小寫)?<br>
        2. 檔案是否小於 100MB?<br>
        3. 是否為 H.264 編碼?
    </div>

</body>
</html>
