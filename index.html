<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR360 虛擬導覽</title>
    <style>
        /* --- 1. 極簡透明風格 UI --- */
        body { margin: 0; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* 背景改為更有質感的深邃漸層 */
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center;
            transition: opacity 0.5s ease;
        }

        /* 移除方塊，改用直接排版 */
        h1 { 
            font-size: 36px; font-weight: 200; margin-bottom: 10px; letter-spacing: 3px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        p.subtitle {
            font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 50px; 
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* --- 主按鈕 (透明毛玻璃) --- */
        #start-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 18px 70px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #start-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.25); }

        /* 轉圈圈動畫 */
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none; margin-right: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- VR 控制列 (底部懸浮) --- */
        .vr-controls {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 1000;
        }

        .vr-btn {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            display: none; /* 預設隱藏 */
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .vr-btn:active { transform: scale(0.95); }
        
        /* 右上角退出按鈕 */
        #exit-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1001;
            padding: 10px 20px; font-size: 14px; border-radius: 30px;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3);
            color: white; display: none; backdrop-filter: blur(4px);
        }

        .footer {
            position: absolute; bottom: 20px; width: 100%;
            font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 1px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>VR 360</h1>
        <p class="subtitle">Virtual Reality Tour</p>
        
        <button id="start-btn">
            <div class="spinner" id="btn-spinner"></div>
            <span id="btn-text">開始體驗</span>
        </button>
        
        <div class="footer">Interactive Experience</div>
    </div>

    <div class="vr-controls">
        <button id="enter-vr-btn" class="vr-btn">進入 VR 模式</button>
    </div>
    <button id="exit-btn">退出模式</button>

    <video id="video" loop muted crossOrigin="anonymous" playsinline webkit-playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>
    <canvas id="video-canvas" style="display:none"></canvas>

    <script>
        var camera, scene, renderer, effect, controls;
        var video, videoCanvas, videoContext, texture;
        var isVR = false;

        // UI 元素
        var startBtn = document.getElementById('start-btn');
        var btnSpinner = document.getElementById('btn-spinner');
        var btnText = document.getElementById('btn-text');
        var overlay = document.getElementById('overlay');
        var enterVrBtn = document.getElementById('enter-vr-btn');
        var exitBtn = document.getElementById('exit-btn');

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);

            // Canvas 代理設定
            video = document.getElementById('video');
            videoCanvas = document.getElementById('video-canvas');
            videoContext = videoCanvas.getContext('2d');
            
            videoCanvas.width = 1920; 
            videoCanvas.height = 960;
            videoContext.fillStyle = '#000000';
            videoContext.fillRect(0,0,1920,960);
            
            texture = new THREE.CanvasTexture(videoCanvas);
            texture.minFilter = THREE.LinearFilter;
            
            var geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);
            var material = new THREE.MeshBasicMaterial({ map: texture });
            scene.add(new THREE.Mesh(geometry, material));

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.eyeSeparation = 1;
            effect.setSize(window.innerWidth, window.innerHeight);

            window.addEventListener('resize', onResize, false);
            setupButtons();
            animate();
        }

        function setupButtons() {
            // 1. 開始體驗
            startBtn.addEventListener('click', function() {
                btnSpinner.style.display = 'block';
                btnText.innerText = "載入中...";
                startBtn.style.pointerEvents = 'none';

                video.muted = false; // 開啟聲音
                
                video.play().then(function() {
                    overlay.style.opacity = 0;
                    setTimeout(function(){ overlay.style.display = 'none'; }, 500);
                    enterVrBtn.style.display = 'block';
                    
                    if (video.videoWidth) {
                        videoCanvas.width = video.videoWidth;
                        videoCanvas.height = video.videoHeight;
                    }
                }).catch(function(err) {
                    // 自動播放失敗備案
                    video.muted = true;
                    video.play();
                    overlay.style.opacity = 0;
                    setTimeout(function(){ overlay.style.display = 'none'; }, 500);
                    enterVrBtn.style.display = 'block';
                });
            });

            // 2. 進入 VR
            enterVrBtn.addEventListener('click', function() {
                // 請求權限
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(function(response) {
                            enableVR(); // 無論授權與否都進入，避免卡住
                        })
                        .catch(function(e) { enableVR(); });
                } else {
                    enableVR();
                }
            });

            // 3. 退出 VR (修復卡頓的關鍵邏輯)
            exitBtn.addEventListener('click', function() {
                isVR = false;
                
                // UI 切換
                enterVrBtn.style.display = 'block';
                exitBtn.style.display = 'none';
                
                // 重置控制與相機
                controls = null;
                camera.position.set(0, 0, 0);
                camera.rotation.set(0, 0, 0);
                
                // 【關鍵修復 1】關閉剪裁測試 (Scissor Test)
                // StereoEffect 會開啟這個，退出時必須手動關閉，否則畫面會被切一半或卡住
                renderer.setScissorTest(false);
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                renderer.setSize(window.innerWidth, window.innerHeight);
                
                // 【關鍵修復 2】強制續播影片
                if (video.paused) {
                    video.play();
                }

                // 退出全螢幕
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            });
        }

        function enableVR() {
            isVR = true;
            enterVrBtn.style.display = 'none';
            exitBtn.style.display = 'block';
            
            if (!controls) {
                controls = new THREE.DeviceOrientationControls(camera);
            }

            var docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (effect) effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                texture.needsUpdate = true;
            }

            if (isVR) {
                if (controls) controls.update();
                effect.render(scene, camera);
            } else {
                // 一般模式：全螢幕單一視角
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
