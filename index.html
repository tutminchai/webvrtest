<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <title>VR360 最終修正版</title>
    <style>
        /* --- 1. 極簡 UI --- */
        body { margin: 0; background-color: #000; overflow: hidden; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center; transition: opacity 0.5s;
        }

        h1 { font-size: 32px; font-weight: 200; margin-bottom: 5px; letter-spacing: 2px; }
        p.subtitle { font-size: 14px; color: #888; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }

        #start-btn {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3); color: white;
            padding: 18px 70px; font-size: 18px; border-radius: 50px; cursor: pointer;
            transition: transform 0.2s; display: flex; align-items: center;
        }
        #start-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.25); }

        .spinner {
            width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid #fff;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: none; margin-right: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* VR 控制列 */
        .vr-controls { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 1000; }
        
        .vr-btn {
            background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3); color: white;
            padding: 14px 30px; border-radius: 50px; font-size: 16px; cursor: pointer;
            display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        #exit-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1001;
            padding: 8px 16px; font-size: 13px; border-radius: 20px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3);
            color: white; display: none; cursor: pointer;
        }
        
        /* 調整按鈕：如果還是對不準，可以用這兩個按鈕微調 */
        #adjust-controls {
            position: fixed; bottom: 20px; width: 100%; text-align: center;
            z-index: 1002; display: none; pointer-events: none;
        }
        .adj-btn {
            pointer-events: auto; background: rgba(255,255,255,0.2); border: 1px solid white;
            color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; margin: 0 10px;
        }

    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>VR 360</h1>
        <p class="subtitle">Virtual Reality Tour</p>
        <button id="start-btn">
            <div class="spinner" id="btn-spinner"></div>
            <span id="btn-text">開始體驗</span>
        </button>
    </div>

    <div class="vr-controls">
        <button id="enter-vr-btn" class="vr-btn">進入 VR 模式</button>
    </div>
    <button id="exit-btn">退出模式</button>
    
    <div id="adjust-controls">
        <button class="adj-btn" id="adj-minus">-</button>
        <span style="color:white; font-size:12px; text-shadow:1px 1px 2px black;">瞳距微調</span>
        <button class="adj-btn" id="adj-plus">+</button>
    </div>

    <video id="video" loop muted crossOrigin="anonymous" playsinline webkit-playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>
    <canvas id="video-canvas" style="display:none"></canvas>

    <script>
        var camera, scene, renderer;
        var orbitControls, deviceControls;
        var video, videoCanvas, videoContext, texture;
        var isVR = false;
        
        // 核心修正：兩眼攝影機
        var cameraL, cameraR;
        
        // 【關鍵參數】IPD 修正角度 (Radians)
        // 0.04 約等於 2.3 度。這會把畫面往中間拉，解決大手機重影問題
        var eyeOffsetAngle = 0.035; 

        // UI 元素
        var startBtn = document.getElementById('start-btn');
        var btnSpinner = document.getElementById('btn-spinner');
        var btnText = document.getElementById('btn-text');
        var overlay = document.getElementById('overlay');
        var enterVrBtn = document.getElementById('enter-vr-btn');
        var exitBtn = document.getElementById('exit-btn');
        var adjControls = document.getElementById('adjust-controls');

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // 主攝影機
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 0, 0.1);

            // 建立左右眼專用攝影機 (用於修正重影)
            cameraL = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);
            cameraR = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);

            // Canvas 代理
            video = document.getElementById('video');
            videoCanvas = document.getElementById('video-canvas');
            videoContext = videoCanvas.getContext('2d');
            
            videoCanvas.width = 1920; videoCanvas.height = 960;
            videoContext.fillStyle = '#000000'; videoContext.fillRect(0,0,1920,960);
            
            texture = new THREE.CanvasTexture(videoCanvas);
            texture.minFilter = THREE.LinearFilter;
            
            var geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);
            var material = new THREE.MeshBasicMaterial({ map: texture });
            scene.add(new THREE.Mesh(geometry, material));

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setScissorTest(false);
            document.body.appendChild(renderer.domElement);

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableZoom = false; 
            orbitControls.enablePan = false;  
            orbitControls.rotateSpeed = -0.3; 
            orbitControls.enableDamping = true;

            window.addEventListener('resize', onResize, false);
            setupButtons();
            setupAdjustment(); // 綁定微調按鈕
            animate();
        }

        function setupButtons() {
            startBtn.addEventListener('click', function() {
                btnSpinner.style.display = 'block'; btnText.innerText = "載入中..."; startBtn.style.pointerEvents = 'none';
                video.muted = false;
                var docEl = document.documentElement;
                if(docEl.requestFullscreen) docEl.requestFullscreen().catch(e=>{});

                video.play().then(function() {
                    overlay.style.opacity = 0;
                    setTimeout(function(){ overlay.style.display = 'none'; }, 500);
                    enterVrBtn.style.display = 'inline-block';
                    if (video.videoWidth) { videoCanvas.width = video.videoWidth; videoCanvas.height = video.videoHeight; }
                    window.scrollTo(0, 1);
                }).catch(function(err) {
                    video.muted = true; video.play();
                    overlay.style.opacity = 0; setTimeout(function(){ overlay.style.display = 'none'; }, 500);
                    enterVrBtn.style.display = 'inline-block';
                });
            });

            enterVrBtn.addEventListener('click', function() {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(function() { enableVR(); }).catch(function() { enableVR(); });
                } else { enableVR(); }
            });

            exitBtn.addEventListener('click', function() {
                isVR = false;
                enterVrBtn.style.display = 'inline-block';
                exitBtn.style.display = 'none';
                adjControls.style.display = 'none'; // 隱藏微調鈕
                
                deviceControls = null; 
                orbitControls.enabled = true; 
                
                renderer.setScissorTest(false);
                renderer.clear();
                onResize();
                
                if (video.paused) video.play();
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            });
        }
        
        function setupAdjustment() {
            document.getElementById('adj-plus').addEventListener('click', function() {
                eyeOffsetAngle += 0.005; // 增加內縮角度
                console.log("Offset:", eyeOffsetAngle);
            });
            document.getElementById('adj-minus').addEventListener('click', function() {
                eyeOffsetAngle -= 0.005; // 減少內縮角度
                console.log("Offset:", eyeOffsetAngle);
            });
        }

        function enableVR() {
            isVR = true;
            enterVrBtn.style.display = 'none';
            exitBtn.style.display = 'block';
            
            // 顯示微調按鈕 (救命用的)
            // 如果畫面還是有重影，您可以按 + 或 - 來即時調整
            adjControls.style.display = 'block'; 
            
            orbitControls.enabled = false;
            if (!deviceControls) deviceControls = new THREE.DeviceOrientationControls(camera);

            var docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            setTimeout(onResize, 500);
        }

        function onResize() {
            var aspect = window.innerWidth / window.innerHeight;
            if (isVR) aspect = (window.innerWidth/2) / window.innerHeight;
            
            camera.aspect = aspect; camera.updateProjectionMatrix();
            cameraL.aspect = aspect; cameraL.updateProjectionMatrix();
            cameraR.aspect = aspect; cameraR.updateProjectionMatrix();
            
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                texture.needsUpdate = true;
            }

            if (isVR) {
                if (deviceControls) deviceControls.update();

                // 1. 同步主相機數據
                cameraL.position.copy(camera.position);
                cameraL.quaternion.copy(camera.quaternion);
                
                cameraR.position.copy(camera.position);
                cameraR.quaternion.copy(camera.quaternion);
                
                // 2. 【核心修正】強制旋轉相機，模擬眼球內聚 (Convergence)
                // 左眼往右轉，右眼往左轉，把畫面「拉」回中間
                cameraL.rotateY( -eyeOffsetAngle ); 
                cameraR.rotateY( eyeOffsetAngle );

                // 3. 渲染
                var w = window.innerWidth;
                var h = window.innerHeight;
                
                renderer.setScissorTest(true);
                
                // 左眼
                renderer.setScissor(0, 0, w/2, h);
                renderer.setViewport(0, 0, w/2, h);
                renderer.render(scene, cameraL);
                
                // 右眼
                renderer.setScissor(w/2, 0, w/2, h);
                renderer.setViewport(w/2, 0, w/2, h);
                renderer.render(scene, cameraR);
                
            } else {
                orbitControls.update();
                renderer.setScissorTest(false);
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
