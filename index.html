<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <title>VR360 虛擬導覽</title>
    <style>
        /* --- 1. 強制全螢幕 CSS --- */
        html, body {
            margin: 0; padding: 0;
            background-color: #000;
            overflow: hidden; /* 禁止捲動 */
            width: 100%;
            height: 100%;
            height: 100dvh; /* 針對手機瀏覽器優化的動態高度 */
            position: fixed; /* 鎖定畫面，嘗試隱藏網址列 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none; /* 禁止選取文字 */
            user-select: none;
        }
        
        /* 啟動介面 */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center;
            transition: opacity 0.5s ease;
        }

        h1 { 
            font-size: 32px; font-weight: 200; margin-bottom: 5px; letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        p.subtitle {
            font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 40px; 
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* 主按鈕 */
        #start-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 16px 60px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #start-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }

        /* 轉圈圈 */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none; margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* VR 控制列 */
        .vr-controls {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 100%; text-align: center; pointer-events: none;
        }

        .vr-btn {
            pointer-events: auto;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 15px;
            cursor: pointer;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        
        /* 退出按鈕 (右上角) */
        #exit-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1001;
            padding: 8px 16px; font-size: 13px; border-radius: 20px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3);
            color: white; display: none; cursor: pointer;
        }

        .footer {
            position: absolute; bottom: 20px; width: 100%;
            font-size: 10px; color: rgba(255,255,255,0.2);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>VR 360</h1>
        <p class="subtitle">Virtual Tour Experience</p>
        
        <button id="start-btn">
            <div class="spinner" id="btn-spinner"></div>
            <span id="btn-text">開始體驗</span>
        </button>
        
        <div class="footer">Interactive 360 Video</div>
    </div>

    <div class="vr-controls">
        <button id="enter-vr-btn" class="vr-btn">進入 VR 模式</button>
    </div>
    <button id="exit-btn">退出模式</button>

    <video id="video" loop muted crossOrigin="anonymous" playsinline webkit-playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>
    <canvas id="video-canvas" style="display:none"></canvas>

    <script>
        var camera, scene, renderer, effect, controls;
        var video, videoCanvas, videoContext, texture;
        var isVR = false;

        // UI 元素
        var startBtn = document.getElementById('start-btn');
        var btnSpinner = document.getElementById('btn-spinner');
        var btnText = document.getElementById('btn-text');
        var overlay = document.getElementById('overlay');
        var enterVrBtn = document.getElementById('enter-vr-btn');
        var exitBtn = document.getElementById('exit-btn');

        init();

        function init() {
            // 場景設定
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);

            // Canvas 代理設定 (iPhone 防黑屏)
            video = document.getElementById('video');
            videoCanvas = document.getElementById('video-canvas');
            videoContext = videoCanvas.getContext('2d');
            
            videoCanvas.width = 1920; 
            videoCanvas.height = 960;
            videoContext.fillStyle = '#000000';
            videoContext.fillRect(0,0,1920,960);
            
            texture = new THREE.CanvasTexture(videoCanvas);
            texture.minFilter = THREE.LinearFilter;
            
            var geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);
            var material = new THREE.MeshBasicMaterial({ map: texture });
            scene.add(new THREE.Mesh(geometry, material));

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.eyeSeparation = 1;
            effect.setSize(window.innerWidth, window.innerHeight);

            window.addEventListener('resize', onResize, false);
            setupButtons();
            animate();
        }

        function setupButtons() {
            // 1. 開始體驗
            startBtn.addEventListener('click', function() {
                btnSpinner.style.display = 'block';
                btnText.innerText = "載入中...";
                startBtn.style.pointerEvents = 'none';

                video.muted = false; // 開啟聲音
                
                // 嘗試全螢幕 (Android 有效)
                var docEl = document.documentElement;
                if(docEl.requestFullscreen) docEl.requestFullscreen().catch(e=>{});

                video.play().then(function() {
                    // 成功播放
                    overlay.style.opacity = 0;
                    setTimeout(function(){ overlay.style.display = 'none'; }, 500);
                    enterVrBtn.style.display = 'inline-block';
                    
                    if (video.videoWidth) {
                        videoCanvas.width = video.videoWidth;
                        videoCanvas.height = video.videoHeight;
                    }
                    // 試圖捲動到最上方隱藏網址列 (iOS Hack)
                    window.scrollTo(0, 1);
                }).catch(function(err) {
                    // 失敗備案
                    video.muted = true;
                    video.play();
                    overlay.style.opacity = 0;
                    setTimeout(function(){ overlay.style.display = 'none'; }, 500);
                    enterVrBtn.style.display = 'inline-block';
                });
            });

            // 2. 進入 VR
            enterVrBtn.addEventListener('click', function() {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(function(response) { enableVR(); })
                        .catch(function(e) { enableVR(); });
                } else {
                    enableVR();
                }
            });

            // 3. 退出 VR (修正卡頓的強力版)
            exitBtn.addEventListener('click', function() {
                isVR = false;
                
                // UI 切換
                enterVrBtn.style.display = 'inline-block';
                exitBtn.style.display = 'none';
                
                // 清除控制，重置相機
                controls = null;
                camera.position.set(0, 0, 0);
                camera.rotation.set(0, 0, 0);
                camera.fov = 70;
                camera.updateProjectionMatrix();
                
                // 【關鍵】重置渲染器狀態，清除分屏裁切
                renderer.setScissorTest(false);
                renderer.clear(); // 清除緩衝區
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                
                // 強制重繪一幀
                renderer.render(scene, camera);

                // 【多重保險】確保影片繼續播放
                function forcePlay() {
                    if (video.paused) video.play();
                }
                forcePlay();
                setTimeout(forcePlay, 100); // 0.1秒後再叫一次
                setTimeout(forcePlay, 500); // 0.5秒後再叫一次

                // 退出全螢幕
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            });
        }

        function enableVR() {
            isVR = true;
            enterVrBtn.style.display = 'none';
            exitBtn.style.display = 'block';
            
            if (!controls) {
                controls = new THREE.DeviceOrientationControls(camera);
            }

            var docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (effect) effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 畫布持續更新
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                texture.needsUpdate = true;
            }

            if (isVR) {
                if (controls) controls.update();
                effect.render(scene, camera);
            } else {
                // 確保一般模式下沒有殘留的 Scissor Test
                renderer.setScissorTest(false);
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
