<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VR 測試模式</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    /* 讓按鈕清楚顯示 */
    #play-button {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 150px; height: 60px; background: white; color: black;
      font-size: 20px; z-index: 999; border-radius: 10px; border: none;
      font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="play-button" onclick="startDemo()">點我開始</button>

  <a-scene vr-mode-ui="enabled: true">
    <a-assets>
      <video id="test-video" 
             loop="true" 
             crossorigin="anonymous" 
             playsinline 
             webkit-playsinline>
             <source src="https://aframe.io/aframe/examples/boilerplate/panorama/city.mp4" type="video/mp4">
      </video>
    </a-assets>

    <a-videosphere src="#test-video" rotation="0 -90 0"></a-videosphere>
    <a-camera></a-camera>
  </a-scene>

  <script>
    function startDemo() {
      var video = document.querySelector('#test-video');
      var btn = document.querySelector('#play-button');
      
      // 點擊後播放影片
      video.play();
      
      // 隱藏按鈕
      btn.style.display = 'none';
    }
  </script>
</body>
</html>
