<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR360 最終完美版</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white; text-align: center;
        }
        .box {
            border: 1px solid #555; padding: 25px; border-radius: 15px; 
            background: rgba(255,255,255,0.15); max-width: 85%;
        }
        #start-btn {
            padding: 15px 40px; font-size: 20px; background: #EF2D5E; 
            color: white; border: none; border-radius: 30px; cursor: pointer; margin-top: 20px;
            font-weight: bold;
        }
        p { color: #ccc; margin: 10px 0; font-size: 15px; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.min.js"></script>
    
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script> var vConsole = new VConsole(); </script>
</head>
<body>

    <div id="overlay">
        <div class="box">
            <h2>VR360 體驗</h2>
            <p>1. 點擊「開始」載入影片</p>
            <p>2. 等待畫面出現</p>
            <p>3. 點擊底部 "ENTER VR"</p>
            <button id="start-btn">開始</button>
        </div>
    </div>

    <video id="video" loop muted crossOrigin="anonymous" playsinline webkit-playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>

    <canvas id="video-canvas" style="display:none"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // --- 【關鍵修正】Polyfill 設定 ---
        // 我們強制關閉 DPDB 查詢，避免 iPhone 因為查不到型號而報錯
        const polyfill = new WebXRPolyfill({
            cardboard: true,
            // 這些設定是為了防止紅字錯誤
            allowCardboardOnDesktop: true,
            // 強制使用備用參數，不讓它去網路抓資料庫
            dpdbURL: null 
        });
        console.log("Polyfill active (Safe Mode)");

        let camera, scene, renderer;
        let video, videoCanvas, videoContext, texture;
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);
            
            // --- 畫布與影片設定 ---
            video = document.getElementById('video');
            videoCanvas = document.getElementById('video-canvas');
            videoContext = videoCanvas.getContext('2d');

            // 預設填滿灰色，避免一開始全黑
            videoCanvas.width = 1920;
            videoCanvas.height = 960;
            videoContext.fillStyle = '#444';
            videoContext.fillRect(0,0, videoCanvas.width, videoCanvas.height);

            texture = new THREE.CanvasTexture(videoCanvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            
            // 球體
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            const material = new THREE.MeshBasicMaterial({ map: texture });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local');
            
            container.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            window.addEventListener('resize', onWindowResize);

            // --- 按鈕互動 ---
            startBtn.addEventListener('click', function() {
                // 解除靜音並播放
                video.muted = false;
                video.play().then(()=> {
                    console.log("Video Play Success");
                    overlay.style.display = 'none';
                    if(video.videoWidth) {
                        videoCanvas.width = video.videoWidth;
                        videoCanvas.height = video.videoHeight;
                    }
                }).catch(err => {
                    console.error("Play Failed:", err);
                    // 備案：如果解鎖聲音失敗，嘗試靜音播放
                    video.muted = true;
                    video.play();
                    overlay.style.display = 'none';
                });
            });
        }

        function onWindowResize() {
            // --- 【關鍵修正】防止 VR 模式下的尺寸衝突 ---
            // 只有在「不是」VR 呈現模式時，才允許調整視窗大小
            if (!renderer.xr.isPresenting) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // 每一幀手動將 Video 畫到 Canvas 上 (解決 iPhone 黑畫面)
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                texture.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
