<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>VR360 體驗 (穩定版)</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: sans-serif; }

        /* 【關鍵 2】絕對不要用 display: none 隱藏影片！ 
           iPhone 會以為不用播放。改用透明度隱藏。 */
        #vr-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px; 
            height: 1px;
            opacity: 0.01; /* 讓它保持微弱可見，騙過瀏覽器 */
            z-index: -1;
            pointer-events: none;
        }

        /* UI 介面 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center;
        }
        .box { 
            background: rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.2); max-width: 80%;
        }
        #start-btn {
            margin-top: 25px; padding: 15px 50px; font-size: 20px; font-weight: bold;
            background: #EF2D5E; color: white; border: none; border-radius: 50px;
        }
        
        #enter-vr-btn {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 9998; display: none;
            padding: 12px 25px; background: rgba(0,0,0,0.8); border: 2px solid #fff;
            color: white; border-radius: 30px; font-weight: bold;
        }
    </style>
</head>
<body>

    <video id="vr-video" 
           src="video.mp4" 
           preload="auto" 
           loop="true" 
           crossorigin="anonymous" 
           playsinline 
           webkit-playsinline
           muted>
    </video>

    <div id="overlay">
        <div class="box">
            <h3>VR 啟動模式</h3>
            <p>請點擊下方按鈕開始載入</p>
        </div>
        <button id="start-btn" onclick="startApp()">載入影片</button>
    </div>

    <div id="enter-vr-btn" onclick="enterVR()">進入 VR 模式</div>

    <a-scene vr-mode-ui="enabled: false"
             loading-screen="dotsColor: white; backgroundColor: black">
        
        <a-sky src="#vr-video" rotation="0 -90 0"></a-sky>

        <a-camera position="0 0 0" look-controls="enabled: true"></a-camera>
    </a-scene>

    <script>
        var video = document.getElementById('vr-video');
        var scene = document.querySelector('a-scene');

        function startApp() {
            // 播放影片
            video.play().then(() => {
                console.log("Video Started");
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('enter-vr-btn').style.display = 'block';
            }).catch(e => {
                alert("播放失敗，請檢查檔案格式");
                console.error(e);
            });
        }

        function enterVR() {
            // 針對 iOS 13+ 的權限請求 (A-Frame 1.2.0 需要手動處理這段)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            goVR();
                        } else {
                            alert('請允許動作感測器權限');
                        }
                    })
                    .catch(console.error);
            } else {
                goVR();
            }
        }

        function goVR() {
            scene.enterVR();
            
            // 【關鍵 4】進入 VR 後，再次強制確保影片在播放
            // 有時候 iOS 切換全螢幕會自動暫停
            setTimeout(() => {
                if(video.paused) {
                    video.play();
                }
            }, 1000);
        }
    </script>
</body>
</html>
