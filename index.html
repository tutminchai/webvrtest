<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js VR360 核心版</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        
        /* 啟動覆蓋層 */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; color: white;
        }
        #start-btn {
            padding: 15px 40px; font-size: 20px; background: #EF2D5E; 
            color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;
        }
        p { color: #ccc; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>VR360 核心播放器</h2>
        <p>1. 點擊開始</p>
        <p>2. 點擊下方 "ENTER VR"</p>
        <button id="start-btn">開始體驗</button>
    </div>

    <video id="video" loop crossOrigin="anonymous" playsinline style="display:none">
        <source src="video.mp4" type="video/mp4">
    </video>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        let camera, scene, renderer;
        let video, texture;

        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            // 1. 建立場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 預設背景黑

            // 2. 建立攝影機
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 2000);
            
            // 3. 處理影片與材質 (最關鍵的一步)
            video = document.getElementById('video');
            
            // 建立 VideoTexture
            texture = new THREE.VideoTexture(video);
            texture.colorSpace = THREE.SRGBColorSpace; // 確保顏色正確
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            // 4. 建立球體 (把影片貼在球內壁)
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            // 幾何體翻轉 (因為我們是在球裡面看)
            geometry.scale(-1, 1, 1);

            // 使用 Basic 材質 (不受光照影響，避免全黑)
            const material = new THREE.MeshBasicMaterial({ map: texture });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // 5. 渲染器設定
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 開啟 VR 支援
            renderer.xr.enabled = true; 
            // 修正顏色編碼
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            
            container.appendChild(renderer.domElement);

            // 6. 加入官方的 VR 按鈕
            // 這會自動偵測裝置並產生 "ENTER VR"
            document.body.appendChild(VRButton.createButton(renderer));

            // RWD 調整
            window.addEventListener('resize', onWindowResize);

            // 綁定按鈕事件
            startBtn.addEventListener('click', function() {
                overlay.style.display = 'none';
                
                // 解鎖聲音並播放
                video.muted = false;
                video.play().then(()=> {
                    console.log("Video Playing");
                }).catch(err => {
                    console.error("Play failed:", err);
                    alert("播放失敗，請確認影片格式");
                });
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            // 使用 WebXR 專用的渲染迴圈
            renderer.setAnimationLoop(render);
        }

        function render() {
            // 如果影片在播放，確保紋理更新
            // Three.js 的 VideoTexture 通常會自動處理，但這裡我們不干涉
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
